[package]
name = "jmx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glyphon = "0.12.0"
log = "0.4.34"
pollster = "1.0.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies optimized in debug builds so text shaping stays fast while developing.
[profile.dev.package."*"]
opt-level = 2
