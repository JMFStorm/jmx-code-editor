[package]
name = "jdc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12.0"
ignore = "0.4.33"
log = { version = "0.4.34", features = ["max_level_trace", "release_max_level_info"] }
notify = "8.2.0"
png = "0.18.1"
pollster = "1.0.1"
quick-xml = "0.42.0"
regex = "1.13.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies optimized in debug builds so text shaping stays fast while developing.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3.0.12"
